name: Lupine Science CI / Cloudflare Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # `*` does not match `/`, which silently skips worktree/task branches.
    branches: ['**']

concurrency:
  # A branch push and its pull_request run share a head SHA but have different
  # deployment eligibility. Keep them in separate groups so the later push
  # completion cannot cancel an in-flight preview smoke gate.
  group: lupine-science-deploy-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.event || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  CF_PAGES_PROJECT: lupine-science

jobs:
  lighthouse:
    # A deployment gate is useful only for a successful main push or a
    # same-repository, human-authored PR. Fork/bot previews cannot safely use
    # repository deployment credentials and generated duplicate/noisy runs.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (
        (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
        (
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.actor.type != 'Bot'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lighthouse CI (scores gate the deploy)
        run: npx --yes @lhci/cli@0.15.x autorun --config=lighthouserc.json

      - name: Explain failure in run summary
        if: failure()
        run: |
          {
            echo "## Lighthouse gate failed"
            echo '```json'
            cat .lighthouseci/assertion-results.json 2>/dev/null | head -c 4000 || echo "no assertion results file"
            echo ""
            echo '```'
            echo "_Reproduce locally: \`npx @lhci/cli autorun --config=lighthouserc.json\` (CHROME_PATH may be needed). Report links are in the step log above._"
          } >> "$GITHUB_STEP_SUMMARY" || true

  deploy-preview:
    needs: lighthouse
    if: |
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.type != 'Bot'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}

    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # This job has deployment credentials and a write-capable GITHUB_TOKEN.
      # Never check out or execute pull-request code here; deploy only the
      # artifact created by the exact successful CI run.
      - name: Download site artifact from successful CI run
        uses: actions/download-artifact@v4
        with:
          name: lupine-science-public-${{ github.event.workflow_run.head_sha }}
          path: public
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify downloaded artifact
        run: |
          test -f public/index.html
          test -f public/health

      - name: Validate Cloudflare secrets
        run: |
          miss=0
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && { echo "::error::MISSING SECRET: CLOUDFLARE_API_TOKEN"; miss=1; }
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && { echo "::error::MISSING SECRET: CLOUDFLARE_ACCOUNT_ID"; miss=1; }
          exit $miss

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          branch="${{ github.event.workflow_run.head_branch }}"
          log_file="$(mktemp)"
          npx --yes wrangler@latest pages deploy public \
            --project-name "$CF_PAGES_PROJECT" \
            --branch "$branch" \
            --commit-hash "${{ github.event.workflow_run.head_sha }}" \
            --commit-dirty=true | tee "$log_file"
          url="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' "$log_file" | tail -n 1)"
          [ -n "$url" ] || { echo "::error::Could not find Pages deployment URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview deployment
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5; do
            health="$(curl --fail --silent --show-error --max-time 10 "$PREVIEW_URL/health" || true)"
            homepage="$(curl --fail --silent --show-error --max-time 10 "$PREVIEW_URL/" || true)"
            if [ "$health" = "ok" ] && grep -q "Evidence before claim" <<<"$homepage"; then
              echo "Preview smoke test passed"
              exit 0
            fi
            echo "Attempt $attempt failed; waiting for Pages propagation"
            sleep 10
          done
          echo "::error::Preview did not serve the expected health and homepage content"
          exit 1

      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$pr_number" ]; then
            pr_number="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" \
              --jq '[.[] | select(.state == "open")][0].number // empty')"
          fi
          [ -n "$pr_number" ] || { echo "::error::No open pull request found for $HEAD_SHA"; exit 1; }
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Post preview URL to PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          <!-- lupine-science-preview -->
          ✅ Cloudflare Pages preview is ready: $PREVIEW_URL

          Branch: \`$HEAD_BRANCH\`
          Commit: \`$HEAD_SHA\`
          Workflow: $RUN_URL
          EOF

          body="$(cat "$body_file")"
          comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- lupine-science-preview -->")) | .id' | tail -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f "body=$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f "body=$body" >/dev/null
          fi

      - name: Publish preview in check summary
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo "## Cloudflare Pages preview"
            echo
            echo "- Preview: $PREVIEW_URL"
            echo "- Pull request: #$PR_NUMBER"
            echo "- Commit: \`$HEAD_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report preview deploy status
        if: always()
        run: |
          curl -X POST https://glim-think-v1.aw-ab5.workers.dev/ops/report \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"$GITHUB_REPOSITORY\",\"workflow\":\"$GITHUB_WORKFLOW\",\"run_id\":\"$GITHUB_RUN_ID\",\"status\":\"${{ job.status }}\",\"commit_sha\":\"${{ github.event.workflow_run.head_sha }}\",\"branch\":\"${{ github.event.workflow_run.head_branch }}\",\"service\":\"lupine.science\",\"platform\":\"cloudflare-pages\",\"environment\":\"preview\",\"preview_url\":\"${{ steps.deploy.outputs.url }}\",\"pr_number\":\"${{ steps.pr.outputs.number }}\",\"kanban_task\":\"t_7b0219e1\",\"run_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"started_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" || true

      - name: Show output
        run: echo "${{ steps.deploy.outputs.url }}"

  preview-smoke:
    needs: deploy-preview
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Keep untrusted pull-request code out of the credentialed deploy job.
      # This follow-up job has no Cloudflare secrets or write-capable token.
      - name: Checkout exact preview revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF smoke dependencies
        # workflow_run evaluates this job from the default branch, so keep the
        # PDF extractor installation here rather than relying on PR setup.
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Run machine-readable preview smoke gate
        env:
          SMOKE_PREVIEW_BASE_URL: ${{ needs.deploy-preview.outputs.url }}
          SMOKE_REPORT_PATH: ${{ runner.temp }}/live-smoke-preview.json
          SMOKE_ATTEMPTS: '5'
          SMOKE_DELAY_MS: '10000'
        run: npm run smoke

      - name: Upload preview smoke gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-preview-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/live-smoke-preview.json
          if-no-files-found: error
          retention-days: 90

  release-certification:
    name: Release certification
    needs: lighthouse
    if: |
      always() &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Fail closed on unsuccessful release prerequisite
        if: github.event.workflow_run.conclusion != 'success' || needs.lighthouse.result != 'success'
        run: |
          source_result="${{ github.event.workflow_run.conclusion }}"
          lighthouse_result="${{ needs.lighthouse.result }}"
          source_failure="Source CI concluded: $source_result"
          lighthouse_failure="Lighthouse concluded: $lighthouse_result"
          mkdir -p "$RUNNER_TEMP/release-gate-records"
          jq -n \
            --arg commit_sha "${{ github.event.workflow_run.head_sha }}" \
            --arg source_result "$source_result" \
            --arg lighthouse_result "$lighthouse_result" \
            --arg source_failure "$source_failure" \
            --arg lighthouse_failure "$lighthouse_failure" \
            '{schemaVersion: 1, decision: "fail", commitSha: $commit_sha, failures: ([if $source_result != "success" then $source_failure else empty end, if $lighthouse_result != "success" then $lighthouse_failure else empty end])}' \
            > "$RUNNER_TEMP/release-gate-records/release-certification.json"
          echo "::error::$source_failure; $lighthouse_failure; publication remains blocked."
          exit 1

      - name: Download visual gate artifact from source CI
        uses: actions/download-artifact@v4
        with:
          name: publication-visual-gate-${{ github.event.workflow_run.head_sha }}
          path: gate-inputs/visual
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download smoke gate artifact from source CI
        uses: actions/download-artifact@v4
        with:
          name: publication-smoke-gate-${{ github.event.workflow_run.head_sha }}
          path: gate-inputs/smoke
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download audio gate artifact from source CI
        uses: actions/download-artifact@v4
        with:
          name: publication-audio-gate-${{ github.event.workflow_run.head_sha }}
          path: gate-inputs/audio
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Fail closed unless all required suites passed
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-gate-records"
          node scripts/validate-release-gates.mjs \
            --visual gate-inputs/visual/visual-gate.json \
            --smoke gate-inputs/smoke/publication-smoke-gate.json \
            --audio gate-inputs/audio/audio-gate.json \
            --audio-directory public/videos \
            --output "$RUNNER_TEMP/release-gate-records/release-certification.json" \
            --sha "$RELEASE_SHA" \
            --ci-run-url "$CI_RUN_URL" \
            --visual-artifact-url "$CI_RUN_URL#artifacts" \
            --smoke-artifact-url "$CI_RUN_URL#artifacts" \
            --audio-artifact-url "$CI_RUN_URL#artifacts"

      - name: Build release gate notification
        if: always()
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          GATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The SOURCE ci run, distinct from this gate run. Needed so the notification
          # can name the visual/smoke artifacts even when no receipt was written —
          # without it the new --source-*-url flags expand empty and the links are
          # silently dropped by the https:// filter, which is the failure this fixes.
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-gate-records"
          node scripts/build-release-notification.mjs \
            --receipt "$RUNNER_TEMP/release-gate-records/release-certification.json" \
            --release-name "lupine-science@${RELEASE_SHA:0:12}" \
            --gate-run-url "$GATE_RUN_URL" \
            --records-artifact-url "$GATE_RUN_URL#artifacts" \
            --source-run-url "$CI_RUN_URL" \
            --source-artifacts-url "$CI_RUN_URL#artifacts" \
            --markdown-output "$RUNNER_TEMP/release-gate-records/release-notification.md" \
            --json-output "$RUNNER_TEMP/release-gate-records/release-notification.json"
          cat "$RUNNER_TEMP/release-gate-records/release-notification.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Send loud release gate notification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notification="$RUNNER_TEMP/release-gate-records/release-notification.json"
          test -s "$notification"
          issue_payload="$(jq -n \
            --arg title "$(jq -r '.title' "$notification")" \
            --arg body "$(jq -r '.markdown' "$notification")" \
            '{title: $title, body: $body, assignees: ["alexwelcing"]}')"
          if issue_result="$(printf '%s' "$issue_payload" \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/issues" --input - \
                --jq '.html_url' 2>&1)"; then
            echo "Assigned notification: $issue_result" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: assigned release notification FAILED; the job summary and retained release-gate record remain available. Detail: $issue_result" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain release decision and notification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-records-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/release-gate-records/
          if-no-files-found: error
          retention-days: 90

  deploy-production:
    needs: [lighthouse, release-certification]
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Download exact artifact from successful CI run
        uses: actions/download-artifact@v4
        with:
          name: lupine-science-public-${{ github.event.workflow_run.head_sha }}
          path: public
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify approved artifact identity
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
          APPROVED_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          test "$APPROVED_BRANCH" = "main"
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -f public/index.html
          test -f public/health

      - name: Validate Cloudflare secrets
        run: |
          miss=0
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && { echo "::error::MISSING SECRET: CLOUDFLARE_API_TOKEN"; miss=1; }
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && { echo "::error::MISSING SECRET: CLOUDFLARE_ACCOUNT_ID"; miss=1; }
          exit $miss

      - name: Capture previous production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response="$RUNNER_TEMP/production-project-before.json"
          curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PAGES_PROJECT" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            > "$response"
          node scripts/build-rollback-evidence.mjs \
            --select-from "$response" \
            --output "$RUNNER_TEMP/previous-production-deployment.json" \
            --capture-output "$RUNNER_TEMP/rollback-target-capture.json" \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --project-name "$CF_PAGES_PROJECT" \
            --captured-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Deploy production to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          log_file="$RUNNER_TEMP/wrangler-production.log"
          npx --yes wrangler@latest pages deploy public \
            --project-name "$CF_PAGES_PROJECT" \
            --branch main \
            --commit-hash "${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}" \
            --commit-dirty=true | tee "$log_file"
          url="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' "$log_file" | tail -n 1)"
          [ -n "$url" ] || { echo "::error::Could not find Pages deployment URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Record production deployment receipt
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          APPROVAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg environment production \
            --arg branch main \
            --arg commit_sha "$DEPLOYED_SHA" \
            --arg source_ci_run_id "$SOURCE_RUN_ID" \
            --arg source_artifact "lupine-science-public-$DEPLOYED_SHA" \
            --arg deployment_url "$DEPLOY_URL" \
            --arg release_certification_artifact "release-gate-records-$DEPLOYED_SHA" \
            --arg production_approval_record "$APPROVAL_RUN_URL" \
            --arg rollback_evidence_artifact "rollback-evidence-$DEPLOYED_SHA" \
            --arg deployed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{environment: $environment, branch: $branch, commit_sha: $commit_sha, source_ci_run_id: $source_ci_run_id, source_artifact: $source_artifact, release_certification_artifact: $release_certification_artifact, production_approval_record: $production_approval_record, rollback_evidence_artifact: $rollback_evidence_artifact, deployment_url: $deployment_url, deployed_at: $deployed_at}' \
            > "$RUNNER_TEMP/production-deployment-receipt.json"

      - name: Upload production deployment receipt
        id: receipt_upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-receipt-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/production-deployment-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Prove previous deployment remains restorable
        id: rollback_verification
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          previous_id="$(jq -r '.id' "$RUNNER_TEMP/previous-production-deployment.json")"
          previous_url="$(jq -r '.url' "$RUNNER_TEMP/previous-production-deployment.json")"
          curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PAGES_PROJECT/deployments/$previous_id" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            > "$RUNNER_TEMP/verified-rollback-target.json"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$previous_url/health" > "$RUNNER_TEMP/rollback-target-health.txt"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$previous_url/" > "$RUNNER_TEMP/rollback-target-homepage.html"
          node scripts/build-rollback-evidence.mjs \
            --previous "$RUNNER_TEMP/previous-production-deployment.json" \
            --verified-target "$RUNNER_TEMP/verified-rollback-target.json" \
            --health "$RUNNER_TEMP/rollback-target-health.txt" \
            --homepage "$RUNNER_TEMP/rollback-target-homepage.html" \
            --account-id "$CLOUDFLARE_ACCOUNT_ID" \
            --project-name "$CF_PAGES_PROJECT" \
            --deployed-sha "$DEPLOYED_SHA" \
            --deployment-url "$DEPLOY_URL" \
            --verified-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output "$RUNNER_TEMP/rollback-evidence.json"

      - name: Retain rollback evidence
        id: rollback_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rollback-evidence-${{ github.event.workflow_run.head_sha }}
          path: |
            ${{ runner.temp }}/rollback-target-capture.json
            ${{ runner.temp }}/rollback-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Purge Cloudflare cache for custom domain
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          zone_response=$(curl -fsS -X GET "https://api.cloudflare.com/client/v4/zones?name=lupine.science&account.id=${CF_ACCOUNT}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" 2>/tmp/cf-zone-err.log) || {
            echo "::warning::Could not look up Cloudflare zone; cache purge skipped. Details: $(cat /tmp/cf-zone-err.log)"
            exit 0
          }
          zone_id=$(echo "$zone_response" | jq -r '.result[0].id')
          if [ -z "$zone_id" ] || [ "$zone_id" = "null" ]; then
            echo "::warning::Could not find Cloudflare zone for lupine.science; cache purge skipped."
            echo "$zone_response" | jq . >&2
            exit 0
          fi
          purge_response=$(curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' 2>/tmp/cf-purge-err.log) || {
            echo "::warning::Cloudflare cache purge request failed; the deploy still uses cache-busted image URLs so the new content should be served. Details: $(cat /tmp/cf-purge-err.log)"
            exit 0
          }
          if [ "$(echo "$purge_response" | jq -r '.success')" != "true" ]; then
            echo "::warning::Cloudflare cache purge was not successful; cache-busted image URLs will still bypass stale cache."
            echo "$purge_response" | jq . >&2
            exit 0
          fi
          echo "Cloudflare zone cache purged successfully"
          sleep 10

      - name: Smoke test production deployment URL
        id: deployment_smoke
        continue-on-error: true
        env:
          SMOKE_PREVIEW_BASE_URL: ${{ steps.deploy.outputs.url }}
          SMOKE_REPORT_PATH: ${{ runner.temp }}/smoke-deployment-url.json
          SMOKE_ATTEMPTS: '5'
          SMOKE_DELAY_MS: '10000'
        run: |
          set -o pipefail
          npm run smoke 2>&1 | tee "$RUNNER_TEMP/smoke-deployment-url.log"

      - name: Smoke test custom domain
        id: domain_smoke
        continue-on-error: true
        env:
          SMOKE_PRODUCTION_BASE_URL: https://lupine.science
          SMOKE_REPORT_PATH: ${{ runner.temp }}/smoke-custom-domain.json
          SMOKE_ATTEMPTS: '5'
          SMOKE_DELAY_MS: '10000'
        run: |
          set -o pipefail
          npm run smoke 2>&1 | tee "$RUNNER_TEMP/smoke-custom-domain.log"

      - name: Security headers are live
        id: security_headers
        continue-on-error: true
        run: |
          set -o pipefail
          {
          echo "Checking https://lupine.science/ for CSP and HSTS headers"
          # the custom domain can lag the deployment by a few seconds while
          # Pages cuts over — retry like the other smoke tests
          for i in 1 2 3 4 5; do
            hdrs=$(curl -sI https://lupine.science/ -m 10 || true)
            echo "Attempt $i response headers:"
            echo "$hdrs" | grep -iE "content-security-policy|strict-transport-security|cf-cache-status|server" || true
            if echo "$hdrs" | grep -qi "content-security-policy" && echo "$hdrs" | grep -qi "strict-transport-security"; then
              echo "Security headers verified"
              exit 0
            fi
            echo "Attempt $i: headers not visible yet, retrying..."
            sleep 10
          done
          echo "::error::CSP/HSTS headers missing on production after retries"
          exit 1
          } 2>&1 | tee "$RUNNER_TEMP/security-headers.log"

      - name: Show output
        run: echo "${{ steps.deploy.outputs.url }}"

      - name: Upload live verification logs
        id: live_logs_upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: production-live-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wrangler-production.log
            ${{ runner.temp }}/smoke-deployment-url.log
            ${{ runner.temp }}/smoke-deployment-url.json
            ${{ runner.temp }}/smoke-custom-domain.log
            ${{ runner.temp }}/smoke-custom-domain.json
            ${{ runner.temp }}/security-headers.log
          if-no-files-found: ignore
          retention-days: 90

      - name: Fail if deployment evidence was not retained
        if: steps.receipt_upload.outcome != 'success' || steps.rollback_verification.outcome != 'success' || steps.rollback_upload.outcome != 'success' || steps.deployment_smoke.outcome != 'success' || steps.domain_smoke.outcome != 'success' || steps.security_headers.outcome != 'success' || steps.live_logs_upload.outcome != 'success'
        run: |
          echo "::error::One or more post-deploy evidence or live-safety steps failed."
          exit 1

      - name: Notify team of live verification result
        if: always()
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          HEAD_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_DEPLOY_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          RECEIPT_UPLOAD_OUTCOME: ${{ steps.receipt_upload.outcome }}
          ROLLBACK_VERIFICATION_OUTCOME: ${{ steps.rollback_verification.outcome }}
          ROLLBACK_UPLOAD_OUTCOME: ${{ steps.rollback_upload.outcome }}
          DEPLOYMENT_SMOKE_OUTCOME: ${{ steps.deployment_smoke.outcome }}
          DOMAIN_SMOKE_OUTCOME: ${{ steps.domain_smoke.outcome }}
          SECURITY_HEADERS_OUTCOME: ${{ steps.security_headers.outcome }}
          LIVE_LOGS_UPLOAD_OUTCOME: ${{ steps.live_logs_upload.outcome }}
        run: |
          status="${{ job.status }}"
          icon="✅"
          title="Live verification passed"
          if [ "$status" != "success" ]; then
            icon="🚨"
            title="Live verification failed"
          fi

          rollback_command='rollback evidence was not captured before the job stopped'
          if [ -s "$RUNNER_TEMP/rollback-evidence.json" ]; then
            rollback_command="$(jq -r '.rollback.command' "$RUNNER_TEMP/rollback-evidence.json")"
          elif [ -s "$RUNNER_TEMP/rollback-target-capture.json" ]; then
            rollback_command="$(jq -r '.rollback.command' "$RUNNER_TEMP/rollback-target-capture.json")"
          fi
          log_excerpt_file="$RUNNER_TEMP/live-verification-log-excerpt.txt"
          : > "$log_excerpt_file"
          for file in \
            "$RUNNER_TEMP/wrangler-production.log" \
            "$RUNNER_TEMP/smoke-deployment-url.log" \
            "$RUNNER_TEMP/smoke-custom-domain.log" \
            "$RUNNER_TEMP/security-headers.log"; do
            if [ -s "$file" ]; then
              {
                echo "### $(basename "$file")"
                tail -n 80 "$file"
                echo
              } >> "$log_excerpt_file"
            fi
          done
          if [ ! -s "$log_excerpt_file" ]; then
            echo "No live verification logs were captured before the job stopped." > "$log_excerpt_file"
          fi

          # Smoke output prints an actionable URL followed by its failure
          # category. Surface the first pair above the full log excerpt.
          SMOKE_FAILURES_FILE="$log_excerpt_file"
          failing_url="$(grep -m1 -E '^    - https?://' "$SMOKE_FAILURES_FILE" | sed -E 's/^    - //' || true)"
          smoke_detail="$(grep -m1 -E '^      (page unreachable|page body unreadable|missing |canonical URL broken|og:url broken|og:image broken|video link broken|download link broken)' "$SMOKE_FAILURES_FILE" | sed -E 's/^      //' || true)"
          if [ "$status" != "success" ]; then
            failure_categories=()
            [ "$RECEIPT_UPLOAD_OUTCOME" = "failure" ] && failure_categories+=("deployment receipt retention")
            [ "$ROLLBACK_VERIFICATION_OUTCOME" = "failure" ] && failure_categories+=("rollback target verification")
            [ "$ROLLBACK_UPLOAD_OUTCOME" = "failure" ] && failure_categories+=("rollback evidence retention")
            [ "$DEPLOYMENT_SMOKE_OUTCOME" = "failure" ] && failure_categories+=("deployment URL smoke${smoke_detail:+: $smoke_detail}")
            [ "$DOMAIN_SMOKE_OUTCOME" = "failure" ] && failure_categories+=("custom-domain smoke${smoke_detail:+: $smoke_detail}")
            [ "$SECURITY_HEADERS_OUTCOME" = "failure" ] && failure_categories+=("security-header verification")
            [ "$LIVE_LOGS_UPLOAD_OUTCOME" = "failure" ] && failure_categories+=("live-verification log retention")
            failure_category="$(IFS=', '; echo "${failure_categories[*]}")"
            failure_category="${failure_category:-deployment verification stopped before outcomes were recorded}"
            if [ "$DEPLOYMENT_SMOKE_OUTCOME" = "failure" ] || [ "$DOMAIN_SMOKE_OUTCOME" = "failure" ] || [ "$SECURITY_HEADERS_OUTCOME" = "failure" ]; then
              failing_url="${failing_url:-${DEPLOY_URL:-https://lupine.science}}"
            else
              failing_url="not applicable"
            fi
          else
            failing_url="not applicable"
            failure_category="none"
          fi

          notification_file="$RUNNER_TEMP/live-verification-notification.md"
          {
            echo "## $icon $title"
            echo
            echo "Environment: production"
            echo "Branch: \`$HEAD_BRANCH\`"
            echo "Commit: \`$COMMIT_SHA\`"
            echo "Live URL: ${DEPLOY_URL:-https://lupine.science}"
            echo "Workflow: $RUN_URL"
            echo "Artifact: $RUN_URL#artifacts (\`production-live-verification-$GITHUB_RUN_ID\`)"
            echo "Failure category: $failure_category"
            echo "Failing URL: $failing_url"
            echo
            echo "Rollback command:"
            echo '```bash'
            echo "$rollback_command"
            echo '```'
            echo
            echo "Log excerpt:"
            echo '```text'
            cat "$log_excerpt_file"
            echo '```'
          } > "$notification_file"

          cat "$notification_file" >> "$GITHUB_STEP_SUMMARY"

          # The assigned issue is the PRIMARY notification channel, so its failure must
          # NOT abort the step: Actions runs this shell fail-fast, and an unguarded
          # `gh api` non-zero (issues disabled, auth, unavailable assignee, body over
          # the API limit) stopped execution before the Slack and /ops/report fallbacks
          # below — killing every notification at exactly the moment the primary one
          # broke. Failure is now reported into the summary and execution continues.
          issue_title="$icon PRODUCTION LIVE VERIFICATION ${status^^}: lupine-science@${COMMIT_SHA:0:12}"
          issue_payload="$(jq -n \
            --arg title "$issue_title" \
            --arg body "$(cat "$notification_file")" \
            '{title: $title, body: $body, assignees: ["alexwelcing"]}')"
          if issue_result="$(printf '%s' "$issue_payload" \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/issues" --input - \
                --jq '.html_url' 2>&1)"; then
            echo "Assigned notification: $issue_result" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: assigned-issue notification FAILED; falling through to Slack and /ops/report. Detail: $issue_result" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$SLACK_DEPLOY_WEBHOOK_URL" ]; then
            slack_text="$title | ${DEPLOY_URL:-https://lupine.science} | $COMMIT_SHA | category: $failure_category | failing URL: $failing_url | $RUN_URL"
            curl -fsS -X POST "$SLACK_DEPLOY_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg text "$slack_text" '{text: $text}')" || true
          fi

          payload="$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg status "$status" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg branch "$HEAD_BRANCH" \
            --arg service "lupine.science" \
            --arg platform "cloudflare-pages" \
            --arg environment "production" \
            --arg deployment_url "$DEPLOY_URL" \
            --arg run_url "$RUN_URL" \
            --arg started_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notification_type "live-verification" \
            --arg rollback_command "$rollback_command" \
            --arg logs "$(cat "$log_excerpt_file")" \
            --arg notification_markdown "$(cat "$notification_file")" \
            '{repo: $repo, workflow: $workflow, run_id: $run_id, status: $status, commit_sha: $commit_sha, branch: $branch, service: $service, platform: $platform, environment: $environment, deployment_url: $deployment_url, run_url: $run_url, started_at: $started_at, notification_type: $notification_type, rollback_command: $rollback_command, logs: $logs, notification_markdown: $notification_markdown}')"

          curl -fsS -X POST https://glim-think-v1.aw-ab5.workers.dev/ops/report \
            -H "Content-Type: application/json" \
            -d "$payload" || true

      - name: Retain live verification notification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-live-notification-${{ github.run_id }}
          path: ${{ runner.temp }}/live-verification-notification.md
          if-no-files-found: error
          retention-days: 90
