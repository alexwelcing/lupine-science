name: Purge Cloudflare cache

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to purge cache for'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      purge_everything:
        description: 'Purge entire zone cache'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  purge-cache:
    if: ${{ github.ref != 'refs/heads/ops/glim-ledger-d1-maintenance' }}
    runs-on: ubuntu-latest
    # Note: intentionally no protected environment here so an on-demand purge
    # can run immediately. The deploy workflow still gates production deploys.
    steps:
      - name: Validate Cloudflare secrets
        run: |
          miss=0
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && { echo "::error::MISSING SECRET: CLOUDFLARE_API_TOKEN"; miss=1; }
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && { echo "::error::MISSING SECRET: CLOUDFLARE_ACCOUNT_ID"; miss=1; }
          exit $miss

      - name: Look up Cloudflare zone ID
        id: zone
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -X GET "https://api.cloudflare.com/client/v4/zones?name=lupine.science&account.id=${CF_ACCOUNT}" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json")
          zone_id=$(echo "$response" | jq -r '.result[0].id')
          zone_name=$(echo "$response" | jq -r '.result[0].name')
          if [ -z "$zone_id" ] || [ "$zone_id" = "null" ]; then
            echo "::error::Could not find Cloudflare zone for lupine.science"
            echo "$response" | jq . >&2
            exit 1
          fi
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"
          echo "zone_name=$zone_name" >> "$GITHUB_OUTPUT"
          echo "Found zone $zone_name ($zone_id)"

      - name: Purge Cloudflare cache
        id: purge
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
          PURGE_EVERYTHING: ${{ github.event.inputs.purge_everything }}
        run: |
          set -uo pipefail
          if [ "$PURGE_EVERYTHING" = "true" ]; then
            body='{"purge_everything":true}'
            echo "Purging entire zone cache"
          else
            body='{"files":["https://lupine.science/*","https://www.lupine.science/*"]}'
            echo "Purging specific URLs"
          fi
          response=$(curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$body" 2>/tmp/cf-purge-err.log) || {
            echo "::warning::Cache purge request failed. The live site now uses cache-busted image URLs, so stale cache entries are bypassed. Details: $(cat /tmp/cf-purge-err.log)"
            exit 0
          }
          success=$(echo "$response" | jq -r '.success')
          if [ "$success" != "true" ]; then
            echo "::warning::Cache purge was not successful. Cache-busted image URLs will still bypass stale cache."
            echo "$response" | jq . >&2
            exit 0
          fi
          echo "Cache purge succeeded"
          echo "$response" | jq .

      - name: Wait for purge propagation
        run: |
          echo "Allowing purge to propagate across edge nodes..."
          sleep 15

      - name: Verify images serve correct content type
        env:
          SMOKE_PRODUCTION_BASE_URL: https://lupine.science
          SMOKE_ATTEMPTS: '3'
          SMOKE_DELAY_MS: '5000'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run smoke 2>&1 | tee "$RUNNER_TEMP/smoke-after-purge.log"

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purge-cache-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/smoke-after-purge.log
          if-no-files-found: ignore
          retention-days: 7

  glim-ledger-d1-maintenance:
    if: ${{ github.ref == 'refs/heads/ops/glim-ledger-d1-maintenance' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout reviewed lupine-rhizo revision
        uses: actions/checkout@v4
        with:
          repository: alexwelcing/lupine-rhizo
          ref: efb8237f55940312ce0ad848a5e5cd9b4bdc9b0c
          path: lupine-rhizo

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lupine-rhizo/glim-think/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install D1 client
        working-directory: lupine-rhizo/glim-think
        run: npm ci

      - name: Validate Cloudflare secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test "${CLOUDFLARE_API_TOKEN}" != '-'
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Apply migrations and seed reviewed literature hypotheses
        working-directory: lupine-rhizo/glim-think
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply glim-ledger --remote
          python - <<'PY'
          import json
          from pathlib import Path

          statements = []
          for path in sorted(Path('../examples/literature-hypotheses').glob('*.json')):
              contract = json.loads(path.read_text())
              canonical = json.dumps(contract, separators=(',', ':'), sort_keys=True)
              statements.append(
                  "INSERT INTO literature_hypotheses "
                  "(literature_hypothesis_id, contract_json) "
                  f"VALUES ('lit-hypothesis.{path.stem}.v1', "
                  f"'{canonical.replace(chr(39), chr(39) * 2)}') "
                  "ON CONFLICT(literature_hypothesis_id) DO UPDATE SET "
                  "contract_json = excluded.contract_json;"
              )
          Path('../seed-production-hypotheses.sql').write_text(
              '\n'.join(statements) + '\n', encoding='utf-8'
          )
          PY
          npx wrangler d1 execute glim-ledger --remote \
            --file ../seed-production-hypotheses.sql

      - name: Verify protocol-offset sign-skew in production D1
        working-directory: lupine-rhizo/glim-think
        run: |
          set -euo pipefail
          npx wrangler d1 execute glim-ledger --remote --json \
            --command "SELECT literature_hypothesis_id, contract_json, status, readiness, proposed_experiment_predicate FROM literature_hypotheses WHERE literature_hypothesis_id = 'lit-hypothesis.protocol-offset-sign-skew.v1'" \
            > ../production-sign-skew-readback.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('../production-sign-skew-readback.json').read_text())
          rows = [row for result in payload for row in result.get('results', [])]
          expected_id = 'lit-hypothesis.protocol-offset-sign-skew.v1'
          if len(rows) != 1 or rows[0].get('literature_hypothesis_id') != expected_id:
              raise SystemExit(f'production D1 read-back failed: {rows!r}')
          expected_contract = json.loads(
              Path('../examples/literature-hypotheses/protocol-offset-sign-skew.json').read_text()
          )
          if json.loads(rows[0].get('contract_json', 'null')) != expected_contract:
              raise SystemExit('production D1 sign-skew contract differs from reviewed source')
          for column, contract_key in (('status', 'status'), ('readiness', 'readiness')):
              if rows[0].get(column) != expected_contract[contract_key]:
                  raise SystemExit(f'production D1 generated {column} does not match contract')
          expected_predicate = expected_contract['proposedExperiment']['predicate']
          if rows[0].get('proposed_experiment_predicate') != expected_predicate:
              raise SystemExit('production D1 generated predicate does not match contract')
          print(json.dumps({
              'literature_hypothesis_id': rows[0]['literature_hypothesis_id'],
              'status': rows[0]['status'],
              'readiness': rows[0]['readiness'],
              'proposed_experiment_predicate': rows[0]['proposed_experiment_predicate'],
          }, sort_keys=True))
          PY
