name: CI

# One path from commit to site: build, check, deploy. Pull requests get a
# preview; main goes straight to production. Film, audio and image review
# lives in media-review.yml and runs only when media changes.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lupine-science-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CF_PAGES_PROJECT: lupine-science

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # the venture-deck step of the build renders its PDF in Chromium
      - run: npx --yes playwright@1.61.1 install chromium

      - run: npm run build
      - run: npm run lint
      - run: npm run verify

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public/
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    # Deploy credentials never reach fork or bot pull requests, and this job
    # never runs repository code: it ships the artifact the build job made.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No GitHub environment on purpose: the `production` environment carries a
    # required-reviewer rule, and production deploys are fully automatic
    # (see PR #103). The `if:` above is what limits production to main.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: public

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event_name == 'push' && 'main' || github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          log="$(mktemp)"
          npx --yes wrangler@latest pages deploy public \
            --project-name "$CF_PAGES_PROJECT" --branch "$BRANCH" \
            --commit-hash "$SHA" --commit-dirty=true | tee "$log"
          url="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' "$log" | tail -n 1)"
          [ -n "$url" ] || { echo "::error::no Pages URL in wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Purge lupine.science cache
        if: github.event_name == 'push'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          zone="$(curl -fsS "https://api.cloudflare.com/client/v4/zones?name=lupine.science&account.id=$CF_ACCOUNT" \
            -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result[0].id // empty')" || true
          [ -n "$zone" ] || { echo "::warning::zone lookup failed; cache not purged"; exit 0; }
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$zone/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' >/dev/null || echo "::warning::cache purge failed"

      - name: Check the deployment responds
        env:
          URL: ${{ github.event_name == 'push' && 'https://lupine.science' || steps.deploy.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do
            [ "$(curl -fsS -m 10 "$URL/health" || true)" = "ok" ] && { echo "$URL is up"; exit 0; }
            sleep 10
          done
          echo "::error::$URL/health did not answer ok"; exit 1
