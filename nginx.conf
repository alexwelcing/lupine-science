server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # retired pages (mirrors public/_redirects for the container image)
  location ~ ^/one-pager(\.html|/)?$ {
    return 301 /about/;
  }
  location ~ ^/presentations/climate-investor-value(/.*)?$ {
    return 301 /about/;
  }
  location = /proof-pack-climate-series.pdf {
    return 301 /corrections/;
  }
  location ~ ^/atlas/claims(/.*)?$ {
    return 301 /atlas/;
  }

  # The venture deck is password-walled by public/_worker.js on Cloudflare
  # Pages. This image has no password check, so /venture fails closed here.
  location ^~ /venture {
    default_type text/plain;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 503 "Deck temporarily unavailable.\n";
  }

  # Production material and templates: served, but kept out of search
  # indexes (mirrors scripts/_headers.template).
  location ^~ /brand-assets/ {
    add_header X-Robots-Tag "noindex" always;
    try_files $uri $uri/ /index.html;
  }
  location ^~ /proof-pack-template/ {
    add_header X-Robots-Tag "noindex" always;
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

