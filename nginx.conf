server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # retired pages (mirrors public/_redirects for the container image)
  location ~ ^/one-pager(\.html|/)?$ {
    return 301 /about/;
  }
  location ~ ^/presentations/climate-investor-value(/.*)?$ {
    return 301 /about/;
  }
  location = /proof-pack-climate-series.pdf {
    return 301 /corrections/;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

