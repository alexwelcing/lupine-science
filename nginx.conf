server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # retired pages (mirrors public/_redirects for the container image)
  location ~ ^/one-pager(\.html|/)?$ {
    return 301 /about/;
  }
  location ~ ^/presentations/climate-investor-value(/.*)?$ {
    return 301 /about/;
  }
  location = /proof-pack-climate-series.pdf {
    return 301 /corrections/;
  }
  location ~ ^/atlas/claims(/.*)?$ {
    return 301 /atlas/;
  }
  # retired film detail pages; each film's article stays at /articles/<slug>/
  location = /videos/a-field-not-a-neural-net/ { return 301 /articles/a-field-not-a-neural-net/; }
  location = /videos/a-smooth-environment-resolved-error-field/ { return 301 /articles/a-smooth-environment-resolved-error-field/; }
  location = /videos/an-order-of-effort/ { return 301 /articles/an-order-of-effort/; }
  location = /videos/beyond-carbon-the-error-geometry-of-environmental-materials/ { return 301 /articles/beyond-carbon-the-error-geometry-of-environmental-materials/; }
  location = /videos/cement-concrete-and-the-weight-of-the-built-world/ { return 301 /articles/cement-concrete-and-the-weight-of-the-built-world/; }
  location = /videos/critical-minerals-pfas-and-the-remediation-imperative/ { return 301 /articles/critical-minerals-pfas-and-the-remediation-imperative/; }
  location = /videos/five-materials-for-5-to-12-gtco2-year/ { return 301 /articles/five-materials-for-5-to-12-gtco2-year/; }
  location = /videos/from-fantasy-frameworks-to-makeable-materials/ { return 301 /articles/from-fantasy-frameworks-to-makeable-materials/; }
  location = /videos/from-predicted-crystal-to-commercial-cell/ { return 301 /articles/from-predicted-crystal-to-commercial-cell/; }
  location = /videos/investing-in-the-trust-layer/ { return 301 /articles/investing-in-the-trust-layer/; }
  location = /videos/lupi-hfc-refrigerant-research-payloads/ { return 301 /articles/lupi-hfc-refrigerant-research-payloads/; }
  location = /videos/methane-and-refrigerants-cutting-the-non-co2-climate-forcers/ { return 301 /articles/methane-and-refrigerants-cutting-the-non-co2-climate-forcers/; }
  location = /videos/rhizo-non-co2-climate-forcers-lean/ { return 301 /articles/rhizo-non-co2-climate-forcers-lean/; }
  location = /videos/the-02-percent-synthesis-problem/ { return 301 /articles/the-02-percent-synthesis-problem/; }
  location = /videos/the-materials-we-test-against/ { return 301 /articles/the-materials-we-test-against/; }
  location = /videos/the-order-is-right-the-size-is-wrong/ { return 301 /articles/the-order-is-right-the-size-is-wrong/; }
  location = /videos/the-savings-stack/ { return 301 /articles/the-savings-stack/; }
  location = /videos/the-trust-layer/ { return 301 /articles/the-trust-layer/; }
  location = /videos/water-and-air-correcting-the-molecules-we-drink-and-breathe/ { return 301 /articles/water-and-air-correcting-the-molecules-we-drink-and-breathe/; }
  location = /videos/why-lupi/ { return 301 /articles/why-lupi/; }
  location = /videos/why-lupine-science/ { return 301 /articles/why-lupine-science/; }
  location = /videos/z1-union-debrief/ { return 301 /articles/z1-union-debrief/; }

  # The password-walled venture deck left the site on 2026-11-13; decks are
  # shared privately now (mirrors public/_redirects).
  location ~ ^/venture(/.*)?$ {
    return 301 /about/;
  }

  # Production material and templates: served, but kept out of search
  # indexes (mirrors scripts/_headers.template).
  location ^~ /brand-assets/ {
    add_header X-Robots-Tag "noindex" always;
    try_files $uri $uri/ /index.html;
  }
  location ^~ /proof-pack-template/ {
    add_header X-Robots-Tag "noindex" always;
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

