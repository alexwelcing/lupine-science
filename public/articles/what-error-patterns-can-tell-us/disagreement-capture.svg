<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#faf9f6"/><g font-family="Arial, sans-serif" fill="#16171d"><text x="110" y="92" font-size="22" letter-spacing="4" fill="#3d4db3">LUPINE / RESEARCH NOTES / OCTOBER 2026</text><text x="110" y="180" font-size="64" font-weight="600">Where disagreement helped</text><text x="110" y="235" font-size="29" fill="#4c4e58">Selecting 5 of 25 groups captured more error than random selection.</text><text x="400" y="320" font-size="24" fill="#4c4e58">Share of total group error captured</text></g><g stroke="#deddd7" stroke-width="2"><path d="M400 360V650M720 360V650M1040 360V650M1360 360V650"/></g><g font-family="Arial, sans-serif" font-size="23" fill="#6e707a"><text x="386" y="699">0%</text><text x="699" y="699">20%</text><text x="1019" y="699">40%</text><text x="1339" y="699">60%</text></g><g font-family="Arial, sans-serif" font-size="36" fill="#16171d"><text x="110" y="445">MatPES</text><text x="110" y="590">OMat24</text></g><rect x="400" y="392" width="568.4193672306598" height="76" rx="4" fill="#3d4db3"/><rect x="400" y="537" width="752.8234665861348" height="76" rx="4" fill="#3d4db3"/><path d="M720 350V652" stroke="#8a5e1f" stroke-width="4" stroke-dasharray="9 9"/><g font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#16171d"><text x="990" y="442">35.53%</text><text x="1175" y="587">47.05%</text></g><g font-family="Arial, sans-serif" font-size="23"><path d="M110 765H170" stroke="#8a5e1f" stroke-width="4" stroke-dasharray="9 9"/><text x="188" y="773" fill="#8a5e1f">20% expected under uniform random selection</text><text x="110" y="829" fill="#4c4e58">Retrospective archive analysis. Error = sum of group-average force-component MSE.</text><text x="110" y="863" fill="#4c4e58">Fixed group count; no equal-cost comparison or measured retraining gain.</text></g></svg>
