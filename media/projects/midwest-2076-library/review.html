<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Midwest 2076 — Selection Room</title>
  <style>
    :root{color-scheme:dark;--bg:#090b0a;--panel:#121613;--rule:#2a332e;--ink:#edf0ed;--soft:#9da9a2;--acid:#d7ff48;--red:#ef5a3c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}header{position:sticky;top:0;z-index:20;display:flex;gap:20px;align-items:center;justify-content:space-between;padding:14px 22px;background:#090b0aee;border-bottom:1px solid var(--rule);backdrop-filter:blur(12px)}h1{margin:0;font:500 18px/1.1 system-ui,sans-serif}header p{margin:3px 0 0;color:var(--soft);font-size:11px}.actions{display:flex;gap:8px;align-items:center}button,select,input,textarea{font:inherit;color:inherit;background:#171c18;border:1px solid #39433d;border-radius:2px}button,select{padding:8px 10px}button{cursor:pointer}button:hover{border-color:var(--acid)}main{padding:22px}.summary{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin-bottom:20px}.stat{padding:14px;background:var(--panel);border:1px solid var(--rule)}.stat b{display:block;font:500 26px/1 system-ui,sans-serif}.stat span{color:var(--soft);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}.card{overflow:hidden;background:var(--panel);border:1px solid var(--rule)}.card[data-state=publish]{border-color:#778f27}.card[data-state=mutate]{border-color:#a35e31}.card[data-state=reject]{opacity:.65}.image{position:relative;background:#050605}.image img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.image img.portrait{aspect-ratio:4/5}.image img.square{aspect-ratio:1}.badge{position:absolute;top:9px;left:9px;padding:5px 7px;background:#090b0adb;border:1px solid var(--rule);font-size:10px}.body{padding:14px}.title{display:flex;justify-content:space-between;gap:12px;align-items:start}.title h2{margin:0;font:600 17px/1.2 system-ui,sans-serif}.title span{color:var(--soft);font-size:10px}.decision{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.decision select{width:100%}.score{display:grid;grid-template-columns:1fr 110px 20px;gap:8px;align-items:center;margin:5px 0}.score label{font-size:10px;color:var(--soft)}.score input{width:100%;accent-color:var(--acid)}.score output{text-align:right}.weighted{margin:9px 0;color:var(--acid)}textarea{width:100%;min-height:62px;padding:8px;resize:vertical;margin-top:7px}dialog{max-width:94vw;border:1px solid var(--rule);background:#050605;padding:10px}dialog img{max-width:90vw;max-height:86vh}dialog button{position:fixed;top:15px;right:15px}@media(max-width:680px){header{align-items:flex-start;flex-direction:column}.summary{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><div><h1>Midwest 2076 — Selection Room</h1><p>Source-free speculative worldbuilding · local evaluation only</p></div><div class="actions"><select id="class-filter"><option value="">All classes</option></select><select id="state-filter"><option value="">All decisions</option><option>publish</option><option>mutate</option><option>reject</option><option>unreviewed</option></select><button id="export">Export review JSON</button></div></header>
<main><section class="summary"><div class="stat"><b id="generated">0</b><span>generated</span></div><div class="stat"><b id="publish">0</b><span>publish</span></div><div class="stat"><b id="mutate">0</b><span>mutate</span></div><div class="stat"><b id="reject">0</b><span>reject</span></div></section><div id="grid" class="grid"></div></main>
<dialog id="modal"><button>Close</button><img alt="Full-resolution candidate"></dialog>
<script>
const KEY='midwest-2076-selection-v1';
const store=JSON.parse(localStorage.getItem(KEY)||'{}');
const dims=[['worldSpecificity','World specificity'],['functionalClarity','Functional clarity'],['materialIntelligence','Material intelligence'],['institutionalQuality','Institutional quality'],['ownability','Ownability'],['practicalRange','Practical range']];
const weights={worldSpecificity:.2,functionalClarity:.15,materialIntelligence:.2,institutionalQuality:.15,ownability:.2,practicalRange:.1};
let manifest,records=[];
const save=()=>localStorage.setItem(KEY,JSON.stringify(store));
const statusOf=r=>r.status||r.generation?.status||'planned';
const generated=r=>['completed','generated','published'].includes(statusOf(r));
const review=id=>store[id]||(store[id]={state:'unreviewed',scores:Object.fromEntries(dims.map(([k])=>[k,3])),notes:''});
const weighted=s=>dims.reduce((n,[k])=>n+(Number(s[k])||0)*weights[k],0).toFixed(2);
function render(){
 const cf=document.querySelector('#class-filter').value,sf=document.querySelector('#state-filter').value;
 const visible=records.filter(r=>(!cf||r.assetClass===cf)&&(!sf||review(r.id).state===sf));
 document.querySelector('#grid').innerHTML=visible.map(r=>{const v=review(r.id),cls=r.aspectId==='portrait'?'portrait':r.aspectId==='square'?'square':'';return `<article class="card" data-id="${r.id}" data-state="${v.state}"><div class="image"><img class="${cls}" src="/public${r.publicThumbPath}" data-full="/public${r.publicMasterPath}" alt="${r.assetClassName} variation ${r.variation}"><span class="badge">${r.id} · ${r.aspect}</span></div><div class="body"><div class="title"><h2>${r.assetClassName} ${String(r.variation).padStart(2,'0')}</h2><span>${r.assetClass}</span></div><div class="decision"><select data-field="state"><option>unreviewed</option><option>publish</option><option>mutate</option><option>reject</option></select><select data-field="autoReject"><option value="">No automatic reject</option><option>text-or-logo</option><option>generic-ai-trope</option><option>world-failure</option><option>geometry-corruption</option><option>false-authority</option></select></div>${dims.map(([k,l])=>`<div class="score"><label>${l}</label><input type="range" min="1" max="5" step="1" value="${v.scores[k]}" data-score="${k}"><output>${v.scores[k]}</output></div>`).join('')}<div class="weighted">Weighted score: <b>${weighted(v.scores)}</b>/5</div><textarea data-field="notes" placeholder="Reading, strength, weakness, prompt lesson…">${v.notes||''}</textarea></div></article>`}).join('');
 for(const card of document.querySelectorAll('.card')){const id=card.dataset.id,v=review(id);card.querySelector('[data-field=state]').value=v.state;card.querySelector('[data-field=autoReject]').value=v.autoReject||'';card.oninput=e=>{if(e.target.dataset.score){v.scores[e.target.dataset.score]=Number(e.target.value);e.target.nextElementSibling.value=e.target.value;card.querySelector('.weighted b').textContent=weighted(v.scores)}else if(e.target.dataset.field){v[e.target.dataset.field]=e.target.value}card.dataset.state=v.state;save();summarize()};card.querySelector('img').onclick=e=>{modal.querySelector('img').src=e.target.dataset.full;modal.showModal()}}
 summarize();
}
function summarize(){document.querySelector('#generated').textContent=records.length;for(const s of ['publish','mutate','reject'])document.querySelector('#'+s).textContent=records.filter(r=>review(r.id).state===s).length}
Promise.all([fetch('requests.json').then(r=>r.json()),fetch('selection-rubric.json').then(r=>r.json())]).then(([m])=>{manifest=m;records=m.requests.filter(generated);for(const c of m.assetClasses)document.querySelector('#class-filter').insertAdjacentHTML('beforeend',`<option value="${c.id}">${c.name}</option>`);render()}).catch(e=>document.querySelector('#grid').textContent=e.message);
document.querySelector('#class-filter').onchange=render;document.querySelector('#state-filter').onchange=render;modal.querySelector('button').onclick=()=>modal.close();document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify({project:'midwest-2076-brand-library',exportedAt:new Date().toISOString(),reviews:store},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='midwest-2076-review.json';a.click();URL.revokeObjectURL(a.href)};
</script>
</body>
</html>
