<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101513" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#101513" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="10" result="offsetBlur"/>
      <feFlood flood-color="#101513" flood-opacity="0.32" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#76A9C3"/>
    </marker>
    <marker id="arrow-copper" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#C97745"/>
    </marker>
    <marker id="arrow-lichen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#B4BE92"/>
    </marker>
    <style>
      .title { font: 700 48px 'DejaVu Sans', sans-serif; letter-spacing: -1px; fill: #F2EFE6; }
      .kicker { font: 700 18px 'DejaVu Sans', sans-serif; letter-spacing: 3px; fill: #F2EFE6; }
      .label { font: 700 22px 'DejaVu Sans', sans-serif; fill: #101513; }
      .small { font: 600 17px 'DejaVu Sans', sans-serif; fill: #F2EFE6; }
      .micro { font: 700 14px 'DejaVu Sans', sans-serif; letter-spacing: 1.3px; fill: #F2EFE6; }
      .pipe { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .outline { stroke: #101513; stroke-width: 5; }
    </style>
  </defs>

  <image x="0" y="0" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" xlink:href="../assets/plates/plate-01-civic-hall.png"/>
  <rect width="1920" height="1080" fill="url(#shade)"/>

  <g transform="translate(80 68)">
    <rect width="780" height="118" rx="18" fill="#101513" fill-opacity="0.88"/>
    <text x="34" y="42" class="kicker">ONE TEST DISCIPLINE · TWO MATERIAL DIRECTIONS</text>
    <text x="34" y="94" class="title">Recover what we need.</text>
  </g>
  <g transform="translate(1060 68)">
    <rect width="780" height="118" rx="18" fill="#101513" fill-opacity="0.88"/>
    <text x="34" y="42" class="kicker">CONTAINMENT BEFORE CLAIM</text>
    <text x="34" y="94" class="title">Destroy what we don’t.</text>
  </g>

  <!-- central measurement spine: sensors are separate, data relation is shared -->
  <g filter="url(#shadow)">
    <rect x="865" y="268" width="190" height="462" rx="24" fill="#101513" fill-opacity="0.94" stroke="#F2EFE6" stroke-width="4"/>
    <text x="960" y="307" text-anchor="middle" class="micro">MEASUREMENT</text>
    <text x="960" y="330" text-anchor="middle" class="micro">SPINE</text>
    <line x1="910" y1="380" x2="1010" y2="380" stroke="#F2EFE6" stroke-width="3"/>
    <circle cx="960" cy="438" r="36" fill="none" stroke="#F2EFE6" stroke-width="5"/>
    <path d="M938 438h44M960 416v44" stroke="#F2EFE6" stroke-width="5"/>
    <line x1="910" y1="500" x2="1010" y2="500" stroke="#F2EFE6" stroke-width="3"/>
    <path d="M920 560h80M920 590h80M920 620h80" stroke="#F2EFE6" stroke-width="5"/>
    <text x="960" y="685" text-anchor="middle" class="small">same test</text>
    <text x="960" y="708" text-anchor="middle" class="small">separate flows</text>
  </g>

  <!-- left: recovery line -->
  <g filter="url(#shadow)">
    <rect x="92" y="880" width="650" height="62" rx="18" fill="#101513" fill-opacity="0.92"/>
    <text x="417" y="918" text-anchor="middle" class="small">MINERAL-RICH FEED → RECOVERED FRACTION</text>
  </g>
  <path class="pipe" d="M105 665 H295" stroke="#76A9C3" stroke-width="25" marker-end="url(#arrow-blue)"/>
  <path class="pipe" d="M104 665 H295" stroke="#F2EFE6" stroke-opacity="0.38" stroke-width="7"/>
  <g filter="url(#shadow)">
    <rect x="300" y="514" width="190" height="300" rx="28" fill="#F2EFE6" class="outline"/>
    <rect x="335" y="555" width="120" height="177" rx="14" fill="#B4BE92" stroke="#101513" stroke-width="5"/>
    <path d="M350 590h90M350 630h90M350 670h90" stroke="#101513" stroke-width="5" opacity="0.65"/>
    <rect x="350" y="750" width="90" height="26" rx="8" fill="#C97745"/>
    <rect x="292" y="818" width="206" height="66" rx="13" fill="#101513"/>
    <text x="395" y="846" text-anchor="middle" class="small">SELECTIVE</text>
    <text x="395" y="871" text-anchor="middle" class="small">CARTRIDGE</text>
  </g>
  <path class="pipe" d="M490 665 H655 V555 H815" stroke="#C97745" stroke-width="22" marker-end="url(#arrow-copper)"/>
  <path class="pipe" d="M490 665 H655 V555 H815" stroke="#F2EFE6" stroke-opacity="0.34" stroke-width="6"/>
  <g filter="url(#shadow)">
    <path d="M690 436h125v250c0 35-28 63-63 63s-62-28-62-63z" fill="#F2EFE6" stroke="#101513" stroke-width="5"/>
    <path d="M706 610h93v77c0 26-21 46-47 46s-46-20-46-46z" fill="#C97745" opacity="0.86"/>
    <rect x="657" y="758" width="190" height="65" rx="13" fill="#101513"/>
    <text x="752" y="785" text-anchor="middle" class="small">RECOVERED</text>
    <text x="752" y="810" text-anchor="middle" class="small">FRACTION</text>
  </g>
  <path class="pipe" d="M395 514 V430 H596 V486" stroke="#B4BE92" stroke-width="17" marker-end="url(#arrow-lichen)"/>
  <text x="500" y="414" text-anchor="middle" class="small">wash + regenerate</text>
  <path d="M815 555 H865" stroke="#F2EFE6" stroke-width="5" stroke-dasharray="10 10"/>
  <circle cx="835" cy="555" r="13" fill="#F2EFE6" stroke="#101513" stroke-width="4"/>

  <!-- right: capture + contained pilot -->
  <g filter="url(#shadow)">
    <rect x="1178" y="880" width="650" height="62" rx="18" fill="#101513" fill-opacity="0.92"/>
    <text x="1503" y="918" text-anchor="middle" class="small">PFAS-CONTAMINATED FEED → CONTAINED PILOT</text>
  </g>
  <path class="pipe" d="M1812 665 H1632" stroke="#76A9C3" stroke-width="25" marker-end="url(#arrow-blue)"/>
  <path class="pipe" d="M1812 665 H1632" stroke="#F2EFE6" stroke-opacity="0.38" stroke-width="7"/>
  <g filter="url(#shadow)">
    <rect x="1440" y="514" width="190" height="300" rx="28" fill="#F2EFE6" class="outline"/>
    <rect x="1475" y="555" width="120" height="177" rx="14" fill="#D36B61" fill-opacity="0.78" stroke="#101513" stroke-width="5"/>
    <path d="M1490 590h90M1490 630h90M1490 670h90" stroke="#101513" stroke-width="5" opacity="0.65"/>
    <rect x="1490" y="750" width="90" height="26" rx="8" fill="#C97745"/>
    <rect x="1432" y="818" width="206" height="66" rx="13" fill="#101513"/>
    <text x="1535" y="846" text-anchor="middle" class="small">CAPTURE</text>
    <text x="1535" y="871" text-anchor="middle" class="small">CARTRIDGE</text>
  </g>
  <!-- double-contained transfer -->
  <path class="pipe" d="M1440 665 H1325 V555 H1110" stroke="#101513" stroke-width="34"/>
  <path class="pipe" d="M1440 665 H1325 V555 H1110" stroke="#C97745" stroke-width="18" marker-end="url(#arrow-copper)"/>
  <path class="pipe" d="M1440 665 H1325 V555 H1110" stroke="#F2EFE6" stroke-opacity="0.28" stroke-width="5"/>
  <g filter="url(#shadow)">
    <rect x="1085" y="414" width="250" height="335" rx="26" fill="#101513" stroke="#D36B61" stroke-width="7"/>
    <rect x="1110" y="442" width="200" height="225" rx="16" fill="#F2EFE6"/>
    <path d="M1150 628V505h120v123" fill="none" stroke="#C97745" stroke-width="16"/>
    <path d="M1132 690h156" stroke="#D36B61" stroke-width="8"/>
    <text x="1210" y="706" text-anchor="middle" class="micro">PROPOSED PILOT</text>
    <text x="1210" y="779" text-anchor="middle" class="small">CONTAINED</text>
    <text x="1210" y="805" text-anchor="middle" class="small">DESTRUCTION</text>
  </g>
  <path d="M1105 555 H1055" stroke="#F2EFE6" stroke-width="5" stroke-dasharray="10 10"/>
  <circle cx="1080" cy="555" r="13" fill="#F2EFE6" stroke="#101513" stroke-width="4"/>

  <!-- explicit separation -->
  <path d="M960 765V935" stroke="#F2EFE6" stroke-width="3" stroke-dasharray="10 14" opacity="0.75"/>
  <g transform="translate(743 970)">
    <rect width="434" height="70" rx="16" fill="#101513" fill-opacity="0.92" stroke="#F2EFE6" stroke-width="3"/>
    <text x="217" y="29" text-anchor="middle" class="micro">NO SHARED PROCESS STREAM</text>
    <text x="217" y="53" text-anchor="middle" class="small">measurement crosses · matter does not</text>
  </g>
</svg>
